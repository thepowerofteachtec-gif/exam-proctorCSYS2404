# Render Blueprint — CSYS2404, PAID (Starter) plan, always-on, saved-data disk.
services:
  - type: web
    name: exam-proctor-csys2404
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: INSTRUCTOR_PW
        sync: false
      - key: DB_PATH
        value: /var/data/exam.db
    disk:
      name: exam-data
      mountPath: /var/data
      sizeGB: 1
