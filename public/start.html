<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
  .card { width: 100%; max-width: 25rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .3rem; font-weight: 650; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; line-height: 1.5; }
  .meta b { color: var(--ink); font-weight: 600; }
  label { display: block; font-size: .82rem; color: var(--muted); margin: 1rem 0 .35rem; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: .7rem .85rem; border-radius: 8px; font-size: 1rem; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .btn { width: 100%; margin-top: 1.6rem; padding: .85rem; font-size: 1rem; }
  .err { color: var(--danger); font-size: .88rem; margin-top: 1rem; min-height: 1.2rem; }
  .notice { margin-top: 1.5rem; font-size: .8rem; color: var(--faint); line-height: 1.55; border-top: 1px solid var(--line); padding-top: 1rem; }
  .pass { display: none; }
  .pass.show { display: block; }
</style></head><body>
<div class="wrap"><div class="card">
  <div class="brand"></div>
  <h1 id="title">Examination</h1>
  <p class="meta" id="meta"></p>
  <label for="name">Full name</label>
  <input id="name" autocomplete="name" placeholder="Your full name">
  <label for="sid">Student ID</label>
  <input id="sid" autocomplete="off" autocapitalize="off" placeholder="Your student number">
  <div class="pass" id="passWrap">
    <label for="pass">Exam password</label>
    <input id="pass" autocomplete="off" placeholder="Given by your instructor">
  </div>
  <button class="btn" id="go">Start exam</button>
  <div class="err" id="err"></div>
  <p class="notice" id="notice">Activity during this exam is logged for academic integrity. Please stay on this page and complete the exam on your own.</p>
</div></div>
<script>
  const err = document.getElementById('err');
  fetch('/config').then(r => r.json()).then(c => {
    document.getElementById('title').textContent = c.title;
    document.getElementById('meta').innerHTML =
      `<b>${c.totalQuestions}</b> questions · <b>${c.durationMinutes}</b> minutes. The timer starts when you click Start, and the exam submits automatically when time runs out.`;
    if (c.needsPassphrase) document.getElementById('passWrap').classList.add('show');
    if (c.instructions) document.getElementById('notice').textContent = c.instructions;
  });
  document.getElementById('go').onclick = async () => {
    err.textContent = '';
    const nameEl = document.getElementById('name');
    const sidEl = document.getElementById('sid');
    const passEl = document.getElementById('pass');   // only present when the exam uses a password
    const body = {
      name: (nameEl ? nameEl.value : '').trim(),
      student_id: (sidEl ? sidEl.value : '').trim(),
      passphrase: (passEl ? passEl.value : '').trim()
    };
    if (!body.name || !body.student_id) { err.textContent = 'Please enter your name and student ID.'; return; }
    const r = await fetch('/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.error) return err.textContent = d.error;
    if (d.done) return err.textContent = 'You have already submitted this exam.';
    location.href = '/exam?s=' + d.token;
  };
  document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
</script></body></html>
