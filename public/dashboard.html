<style>
  .head { position: sticky; top: env(safe-area-inset-top,0); z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 1rem 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  body::before { content:""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top,0); background: var(--panel); z-index: 11; }
  .head h1 { font-size: 1.1rem; margin: 0; font-weight: 650; }
  .stats { display: flex; gap: 1.4rem; }
  .stat { text-align: center; }
  .stat .n { font-size: 1.4rem; font-weight: 700; font-family: var(--mono); }
  .stat .l { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat.flag .n { color: var(--danger); }
  .wrap { padding: 1.2rem 1.4rem; max-width: 80rem; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: .6rem .7rem; border-bottom: 1px solid var(--line); }
  td { padding: .7rem; border-bottom: 1px solid var(--line); font-size: .9rem; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--panel); }
  .who { font-weight: 600; }
  .who .id { color: var(--faint); font-weight: 400; font-size: .78rem; }
  .live { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; }
  .ledot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--faint); }
  .live.on .ledot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .bar { height: .4rem; background: var(--line); border-radius: 99px; overflow: hidden; width: 7rem; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .risk { font-family: var(--mono); font-weight: 700; }
  .risk.lo { color: var(--ok); } .risk.mid { color: var(--warn); } .risk.hi { color: var(--danger); }
  .st { font-size: .74rem; }
  .st.prog { color: var(--accent); } .st.sub { color: var(--muted); }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(28rem, 100%); background: var(--panel);
    border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .22s ease; z-index: 40; overflow-y: auto;
    padding-top: env(safe-area-inset-top,0); }
  .drawer.open { transform: none; }
  .drawer .dhead { padding: 1.3rem 1.4rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; }
  .drawer .dbody { padding: 1.3rem 1.4rem; }
  .close { background: none; border: 0; color: var(--muted); font-size: 1.5rem; line-height: 1; }
  .kv { display: flex; justify-content: space-between; padding: .45rem 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .kv span:first-child { color: var(--muted); }
  .flagitem { display: flex; justify-content: space-between; gap: .8rem; padding: .6rem .8rem; background: var(--bg); border: 1px solid var(--line);
    border-left: 3px solid var(--warn); border-radius: 6px; margin-bottom: .5rem; font-size: .85rem; }
  .flagitem.hi { border-left-color: var(--danger); }
  .flagitem .t { color: var(--faint); font-size: .75rem; font-family: var(--mono); }
  .sechead { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 1.5rem 0 .7rem; }
  .login { min-height: 100vh; display: grid; place-items: center; }
  .login .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; width: min(22rem, 90vw); }
  .login input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: .65rem; border-radius: 8px; margin: 1rem 0; }
  .empty { text-align: center; color: var(--faint); padding: 4rem 1rem; }
</style></head><body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let token = new URLSearchParams(location.search).get('t');
let socket, state = null, openId = null;
const app = document.getElementById('app');
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const riskClass = r => r >= 20 ? 'hi' : r >= 10 ? 'mid' : 'lo';

function loginView() {
  app.innerHTML = `<div class="login"><div class="card">
    <div class="brand"></div>
    <h1 style="margin:0 0 .3rem">Proctoring dashboard</h1>
    <p style="color:var(--muted);font-size:.88rem;margin:0">Instructor sign-in</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" style="width:100%" id="in">Sign in</button>
    <div id="e" style="color:var(--danger);font-size:.85rem;margin-top:.8rem;min-height:1rem"></div>
  </div></div>`;
  document.getElementById('in').onclick = async () => {
    const r = await fetch('/api/instructor/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
    const d = await r.json();
    if (d.error) return document.getElementById('e').textContent = d.error;
    token = d.token; connect();
  };
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('in').click(); });
}

function connect() {
  socket = io();
  socket.emit('instructor:join', { token });
  socket.on('denied', loginView);
  socket.on('overview', o => { state = o; renderMain(); });
  socket.on('flag', f => {
    if (state) { const s = state.students.find(x => x.id === f.attemptId); if (s) s.riskScore = f.riskScore; renderMain(); }
    if (openId === f.attemptId) loadDrawer(openId);
  });
  socket.on('progress', p => { if (state) { const s = state.students.find(x => x.id === p.attemptId); if (s) { s.answered = p.answered; s.currentQ = p.currentQ; } renderMain(); } });
}

function renderMain() {
  if (!state) return;
  const s = state.stats;
  const rows = state.students.map(a => {
    const pct = a.totalQ ? Math.round(a.answered / a.totalQ * 100) : 0;
    const scoreTxt = a.status === 'submitted' && a.score != null ? `${a.score}/${a.maxScore}` : '—';
    return `<tr class="row" data-id="${a.id}">
      <td><div class="who">${esc(a.name)}<div class="id">${esc(a.studentId)}</div></div></td>
      <td><span class="live ${a.connected ? 'on' : ''}"><span class="ledot"></span>${a.connected ? 'Live' : 'Away'}</span></td>
      <td><span class="st ${a.status === 'submitted' ? 'sub' : 'prog'}">${a.status === 'submitted' ? 'Submitted' : 'Q' + ((a.currentQ || 0) + 1)}</span></td>
      <td><div class="bar"><i style="width:${pct}%"></i></div><div style="font-size:.72rem;color:var(--faint);margin-top:.25rem">${a.answered}/${a.totalQ}</div></td>
      <td><span class="risk ${riskClass(a.riskScore)}">${a.riskScore}</span></td>
      <td>${scoreTxt}</td></tr>`;
  }).join('');
  app.innerHTML = `
    <div class="head">
      <h1 style="display:inline-flex;align-items:center"><span class="brand-sm"></span>${esc(state.examTitle)}</h1>
      <div class="stats">
        <div class="stat"><div class="n">${s.inProgress}</div><div class="l">In progress</div></div>
        <div class="stat"><div class="n">${s.submitted}</div><div class="l">Submitted</div></div>
        <div class="stat flag"><div class="n">${s.flagged}</div><div class="l">Flagged</div></div>
        <button class="btn ghost" id="exportBtn" style="align-self:center">Download results (CSV)</button>
      </div>
    </div>
    <div class="wrap">
      ${state.students.length ? `<table><thead><tr>
        <th>Student</th><th>Status</th><th>Position</th><th>Progress</th><th>Risk</th><th>Score</th>
      </tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty">No students have launched the exam yet.</div>`}
    </div>
    <div class="drawer ${openId ? 'open' : ''}" id="drawer"></div>`;
  document.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => { openId = tr.dataset.id; loadDrawer(openId); });
  const ex = document.getElementById('exportBtn');
  if (ex) ex.onclick = () => window.open('/api/instructor/export.csv?t=' + token, '_blank');
  if (openId) loadDrawer(openId);
}

async function loadDrawer(id) {
  const r = await fetch('/api/instructor/attempt/' + id + '?t=' + token);
  const d = await r.json();
  if (d.error) return;
  const a = d.attempt;
  const flags = (a.flags || []).slice().reverse();
  const drawer = document.getElementById('drawer');
  if (!drawer) return;
  drawer.classList.add('open');
  const recent = d.events.slice(-40).reverse();
  drawer.innerHTML = `
    <div class="dhead">
      <div><div style="font-weight:650;font-size:1.1rem">${esc(a.name)}</div>
      <div style="color:var(--faint);font-size:.8rem">${esc(a.studentId)}</div></div>
      <button class="close" id="closeD">&times;</button>
    </div>
    <div class="dbody">
      <div class="kv"><span>Risk score</span><span class="risk ${riskClass(a.riskScore)}">${a.riskScore}</span></div>
      <div class="kv"><span>Status</span><span>${a.status === 'submitted' ? 'Submitted (' + (a.submitReason || '') + ')' : 'In progress'}</span></div>
      <div class="kv"><span>Connection</span><span>${a.connected ? 'Live' : 'Away'}</span></div>
      <div class="kv"><span>Last seen</span><span>${a.lastSeen ? agoText(a.lastSeen) : '—'}</span></div>
      <div class="kv"><span>Browser</span><span>${esc(a.browser || '—')}</span></div>
      <div class="kv"><span>Answered</span><span>${a.answered}/${a.totalQ}</span></div>
      ${a.score != null ? `<div class="kv"><span>Score</span><span>${a.score}/${a.maxScore}</span></div>` : ''}
      <div class="kv"><span>First IP</span><span style="font-family:var(--mono);font-size:.8rem">${esc(a.firstIp || '—')}</span></div>
      <div class="kv"><span>Last IP</span><span style="font-family:var(--mono);font-size:.8rem">${esc(a.lastIp || '—')}</span></div>

      ${d.pattern ? `<div class="sechead">Performance pattern</div>
      <div class="kv"><span>Accuracy</span><span>${d.pattern.correct}/${d.pattern.answered} correct (${d.pattern.accuracy}%)</span></div>
      <div class="kv"><span>Avg time / question</span><span>${d.pattern.avgTimeMs ? (d.pattern.avgTimeMs/1000).toFixed(1)+'s' : '—'}</span></div>
      ${d.pattern.fastCorrect ? `<div class="kv"><span>Correct in under 5s</span><span>${d.pattern.fastCorrect}</span></div>` : ''}
      <div style="font-family:var(--mono);letter-spacing:.1em;margin:.6rem 0;word-break:break-all">${d.pattern.sequence.replace(/C/g,'<span style="color:var(--ok)">\u2713</span>').replace(/X/g,'<span style="color:var(--danger)">\u2717</span>').replace(/·/g,'<span style="color:var(--faint)">\u00b7</span>')}</div>` : ''}

      <div class="sechead">Integrity flags (${flags.length})</div>
      ${flags.length ? flags.map(f => `<div class="flagitem ${f.weight >= 8 ? 'hi' : ''}">
        <span>${esc(f.label)}</span><span class="t">${fmtTime(f.ts)}</span></div>`).join('')
        : '<div style="color:var(--faint);font-size:.85rem">No flags raised.</div>'}

      ${d.review ? `<div class="sechead">Per-question answers</div>
      <table style="width:100%;border-collapse:collapse;font-size:.82rem">
        ${d.review.map(r => `<tr style="border-bottom:1px solid var(--line)">
          <td style="padding:.4rem .3rem;color:var(--faint);width:1.6rem">${r.index}</td>
          <td style="padding:.4rem .3rem">${r.answered ? esc(r.studentAnswer) : '<i style="color:var(--faint)">blank</i>'}
            <span style="color:var(--faint)">\u2192 ${esc(r.correctAnswer)}</span></td>
          <td style="padding:.4rem .3rem;text-align:right;white-space:nowrap">${!r.answered ? '' : r.correct ? '<span style="color:var(--ok)">\u2713</span>' : '<span style="color:var(--danger)">\u2717</span>'} <span style="color:var(--faint)">${r.timeMs ? (r.timeMs/1000).toFixed(0)+'s' : ''}</span></td>
        </tr>`).join('')}
      </table>
      <button class="btn ghost" style="width:100%;margin-top:1rem" id="reportBtn">Open full report (printable)</button>
      <button class="btn ghost" style="width:100%;margin-top:.6rem" id="respBtn">Download all responses (CSV)</button>` : ''}

      <div class="sechead">Activity log</div>
      ${recent.map(e => `<div class="flagitem" style="border-left-color:var(--line)">
        <span>${esc(e.label)}${e.qid ? ' · ' + e.qid : ''}</span><span class="t">${fmtTime(e.ts)}</span></div>`).join('') || '<div style="color:var(--faint);font-size:.85rem">No activity yet.</div>'}

      ${a.status !== 'submitted' ? `<button class="btn danger" style="width:100%;margin-top:1.5rem" id="forceSubmit">Force submit</button>` : ''}
    </div>`;
  document.getElementById('closeD').onclick = () => { openId = null; drawer.classList.remove('open'); };
  const fs = document.getElementById('forceSubmit');
  if (fs) fs.onclick = async () => { await fetch('/api/instructor/force-submit/' + id + '?t=' + token, { method: 'POST' }); };
  const rb = document.getElementById('reportBtn');
  if (rb) rb.onclick = () => window.open('/api/instructor/report/' + id + '?t=' + token, '_blank');
  const resp = document.getElementById('respBtn');
  if (resp) resp.onclick = () => window.open('/api/instructor/responses.csv?t=' + token, '_blank');
}

function agoText(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  return Math.floor(m / 60) + 'h ago';
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

if (token) connect(); else loginView();
</script></body></html>
