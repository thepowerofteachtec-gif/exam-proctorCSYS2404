<style>
  .topbar { position: sticky; top: env(safe-area-inset-top,0); z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;
    padding: .85rem 1.2rem; gap: 1rem; }
  body::before { content:""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top,0);
    background: var(--panel); z-index: 11; }
  .title { font-weight: 650; font-size: 1rem; }
  .timer { font-family: var(--mono); font-size: 1.05rem; font-weight: 600; padding: .3rem .7rem;
    border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
  .timer.warn { color: var(--warn); border-color: var(--warn); }
  .timer.danger { color: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .shell { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.2rem 6rem; }
  .instructions { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 1rem 1.1rem; color: var(--muted); font-size: .9rem; line-height: 1.6; margin-bottom: 1.5rem; }
  .qcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.2rem; }
  .qhead { display: flex; justify-content: space-between; color: var(--faint); font-size: .8rem; margin-bottom: .9rem; }
  .qtext { font-size: 1.05rem; line-height: 1.55; margin-bottom: 1.2rem; }
  .opt { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: .6rem; cursor: pointer; transition: border-color .12s, background .12s; }
  .opt:hover { border-color: var(--faint); }
  .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .opt input { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
  .nav { max-width: 46rem; margin: 0 auto; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top: 1px solid var(--line); padding: .85rem 1.2rem;
    padding-bottom: calc(.85rem + env(safe-area-inset-bottom,0)); display: flex; align-items: center; gap: .8rem; }
  .progress { flex: 1; color: var(--muted); font-size: .85rem; }
  .dots { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--line); cursor: pointer; }
  .dot.done { background: var(--ok); }
  .dot.here { outline: 2px solid var(--accent); outline-offset: 1px; }
  .overlay { position: fixed; inset: 0; background: rgba(18,40,28,.45); display: none; place-items: center; z-index: 50; padding: 1.5rem; }
  .overlay.show { display: grid; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; max-width: 26rem; text-align: center; }
  .modal h2 { margin: 0 0 .6rem; }
  .modal p { color: var(--muted); line-height: 1.6; }
  .modal .row { display: flex; gap: .8rem; margin-top: 1.5rem; }
  .modal .row .btn { flex: 1; }
</style></head><body>
<div class="topbar"><span style="display:inline-flex;align-items:center"><span class="brand-sm"></span><span class="title" id="examTitle">Examination</span></span><span class="timer" id="timer">--:--</span></div>
<div class="shell">
  <div class="instructions" id="instructions"></div>
  <div id="qhost"></div>
</div>
<div class="nav">
  <div class="progress"><span id="progText">0 answered</span><div class="dots" id="dots"></div></div>
  <button class="btn ghost" id="prev">Back</button>
  <button class="btn" id="next">Next</button>
  <button class="btn" id="submitBtn" style="display:none">Submit</button>
</div>

<div class="overlay" id="confirm"><div class="modal">
  <h2>Submit exam?</h2><p id="confirmText">You can't change answers after submitting.</p>
  <div class="row"><button class="btn ghost" id="cancelSubmit">Keep working</button><button class="btn" id="doSubmit">Submit now</button></div>
</div></div>
<div class="overlay" id="doneModal"><div class="modal">
  <h2 id="doneTitle">Submitted</h2>
  <p id="doneMsg">Your responses were recorded. You can close this tab now.</p>
  <div class="row" id="doneRow" style="display:none"><button class="btn" id="retakeBtn">Take it again</button></div>
</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const token = new URLSearchParams(location.search).get('s');
const socket = io();
let data, idx = 0, answers = {}, clockOffset = 0, deadline = 0, lastTypeTs = 0, submitted = false;

socket.emit('student:join', {
  token,
  client: {
    ua: navigator.userAgent,
    screen: `${screen.width}x${screen.height}`,
    touch: ('ontouchstart' in window) || navigator.maxTouchPoints > 0
  }
});
socket.on('ended', () => showDone());
socket.on('submitted', p => showDone(p));

// --- proctoring signals (silent: no UI feedback on these) ---
// Designed to work the same on any browser: live events go over the socket
// (which itself falls back from WebSocket to HTTP polling when a browser or
// network blocks sockets), and page-exit is additionally sent via sendBeacon,
// which fires reliably even while a tab is closing where a socket can't flush.
function sig(type, detail, qid) { if (!submitted) socket.emit('student:event', { type, qid, detail }); }
function beacon(type) {
  try {
    const payload = JSON.stringify({ token, type, qid: curQid() });
    if (navigator.sendBeacon) navigator.sendBeacon('/beacon', new Blob([payload], { type: 'application/json' }));
    else fetch('/beacon', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true });
  } catch (e) { /* best-effort */ }
}

// Leaving the page: visibilitychange is the most consistent cross-browser signal
// (desktop tab switch AND mobile backgrounding); blur/focus covers desktop alt-tab;
// pagehide covers tab close / navigation away, including mobile Safari.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { sig('tab_blur', { via: 'visibility' }, curQid()); beacon('tab_blur'); }
});
window.addEventListener('blur', () => sig('tab_blur', { via: 'blur' }, curQid()));
window.addEventListener('pagehide', () => { if (!submitted) beacon('page_hide'); });

document.addEventListener('copy', () => sig('copy', null, curQid()));
document.addEventListener('paste', e => {
  const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  sig('paste', { length: text.length }, curQid());
});

// Fullscreen exit, with the vendor-prefixed names Safari and older browsers use.
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev =>
  document.addEventListener(ev, () => {
    const fs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    if (!fs) sig('fullscreen_exit', null, curQid());
  }));
// devtools heuristic — desktop only. Mobile browsers have large chrome/toolbar
// gaps that would false-positive, so skip it on touch devices.
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let dtWarned = false;
if (!isTouch) setInterval(() => {
  const gap = window.outerWidth - window.innerWidth, vgap = window.outerHeight - window.innerHeight;
  if ((gap > 180 || vgap > 220) && !dtWarned) { dtWarned = true; sig('devtools', { gap, vgap }); }
  if (gap < 180 && vgap < 220) dtWarned = false;
}, 1500);
window.addEventListener('resize', () => { if (window.innerWidth < 640 && window.innerHeight < 480) sig('resize_small', { w: innerWidth, h: innerHeight }); });
document.addEventListener('keydown', () => { lastTypeTs = Date.now(); });
setInterval(() => socket.emit('student:heartbeat', { token }), 10000);

const curQid = () => data?.questions?.[idx]?.id;

async function load() {
  const r = await fetch('/api/exam?s=' + token);
  data = await r.json();
  if (data.submitted) return showDone();
  if (data.error) { document.body.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--muted)">Session expired. Go back and sign in again to continue.</div>'; return; }
  examTitle.textContent = data.examTitle;
  instructions.textContent = data.instructions;
  answers = data.answers || {};
  idx = Math.min(data.currentQ || 0, data.questions.length - 1);
  deadline = data.deadline; clockOffset = data.serverTime - Date.now();
  buildDots(); render(); tick();
  setInterval(tick, 500);
}

function buildDots() {
  dots.innerHTML = '';
  data.questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.onclick = () => { saveCurrent(); idx = i; render(); };
    dots.appendChild(d);
  });
}
function refreshDots() {
  [...dots.children].forEach((d, i) => {
    d.classList.toggle('done', answers[data.questions[i].id] != null);
    d.classList.toggle('here', i === idx);
  });
}

function render() {
  const q = data.questions[idx];
  const host = document.getElementById('qhost');
  host.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `<div class="qhead"><span>Question ${idx + 1} of ${data.questions.length}</span><span>${q.points} pt${q.points > 1 ? 's' : ''}</span></div>
    <div class="qtext"></div>`;
  card.querySelector('.qtext').textContent = q.text;
  q.options.forEach(o => {
    const sel = answers[q.id] === o.id;
    const row = document.createElement('label');
    row.className = 'opt' + (sel ? ' sel' : '');
    row.innerHTML = `<input type="radio" name="q" ${sel ? 'checked' : ''}>`;
    const span = document.createElement('span'); span.textContent = o.text; row.appendChild(span);
    row.querySelector('input').onchange = () => selectAnswer(q, o.id);
    card.appendChild(row);
  });
  host.appendChild(card);
  prev.style.display = idx === 0 ? 'none' : '';
  const last = idx === data.questions.length - 1;
  next.style.display = last ? 'none' : '';
  submitBtn.style.display = last ? '' : '';
  progText.textContent = `${Object.keys(answers).length} of ${data.questions.length} answered`;
  refreshDots();
}

function selectAnswer(q, optId) {
  // timing heuristics: very fast answer, or idle-then-answer
  const sinceType = Date.now() - lastTypeTs;
  const prevAns = answers[q.id];
  answers[q.id] = optId;
  socket.emit('student:answer', { token, qid: q.id, value: optId, currentQ: idx });
  if (!q._shownAt) q._shownAt = Date.now();
  const dwell = Date.now() - (q._shownAt || Date.now());
  if (prevAns == null && dwell < 1500) sig('rapid_answer', { ms: dwell }, q.id);
  render();
}
function saveCurrent() {
  const q = data.questions[idx];
  if (answers[q.id] != null) socket.emit('student:answer', { token, qid: q.id, value: answers[q.id], currentQ: idx });
}
// --- per-question active-time tracking ---
// Only counts time while this question is on screen and the tab is visible;
// flushes the elapsed time to the server whenever the student moves on.
let activeQid = null, qEnterTs = 0;
function enterQuestion(qid) {
  if (activeQid === qid) return;
  flushQuestionTime();
  activeQid = qid; qEnterTs = Date.now();
}
function flushQuestionTime() {
  if (activeQid && qEnterTs) {
    const delta = Date.now() - qEnterTs;
    if (delta > 0) socket.emit('student:timing', { token, qid: activeQid, deltaMs: delta });
  }
  qEnterTs = 0;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushQuestionTime();     // pause
  else if (activeQid) qEnterTs = Date.now();                          // resume
});

// stamp question shown time for dwell measurement + start the timer for this question
const _render = render;
render = function () {
  _render();
  const q = data.questions[idx];
  if (!q._shownAt) q._shownAt = Date.now();
  enterQuestion(q.id);
};

prev.onclick = () => { saveCurrent(); idx = Math.max(0, idx - 1); render(); };
next.onclick = () => { saveCurrent(); idx = Math.min(data.questions.length - 1, idx + 1); render(); };
submitBtn.onclick = () => {
  const unanswered = data.questions.length - Object.keys(answers).length;
  confirmText.textContent = unanswered > 0
    ? `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. You can't change answers after submitting.`
    : "You can't change answers after submitting.";
  document.getElementById('confirm').classList.add('show');
};
cancelSubmit.onclick = () => document.getElementById('confirm').classList.remove('show');
doSubmit.onclick = async () => {
  flushQuestionTime();
  submitted = true;
  doSubmit.disabled = true;
  doSubmit.textContent = 'Submitting…';
  try {
    const r = await fetch('/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, answers })
    });
    const d = await r.json();
    if (d.error) { doSubmit.disabled = false; doSubmit.textContent = 'Submit now'; submitted = false; return alert('Could not submit: ' + d.error); }
    showDone(d);
  } catch (e) {
    // network hiccup — fall back to the live connection
    socket.emit('student:submit', { token });
    setTimeout(() => { if (!document.getElementById('doneModal').classList.contains('show')) { doSubmit.disabled = false; doSubmit.textContent = 'Submit now'; submitted = false; } }, 8000);
  }
};

function tick() {
  const remain = deadline - (Date.now() + clockOffset);
  if (remain <= 0) { timer.textContent = '00:00'; return; }
  const m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
  timer.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  timer.className = 'timer' + (remain < 60000 ? ' danger' : remain < 300000 ? ' warn' : '');
}
function showDone(p) {
  submitted = true;
  if (p && p.score != null && p.max != null) {
    const pct = p.max ? Math.round(p.score / p.max * 100) : 0;
    document.getElementById('doneTitle').textContent = `You scored ${p.score} / ${p.max} (${pct}%)`;
  }
  if (p && p.allowRetakes) {
    document.getElementById('doneMsg').textContent = 'This is a practice quiz, so you can take it again to improve.';
    document.getElementById('doneRow').style.display = 'flex';
    document.getElementById('retakeBtn').onclick = () => { location.href = '/'; };
  }
  doneModal.classList.add('show'); document.getElementById('confirm').classList.remove('show');
}
window.addEventListener('beforeunload', e => { if (!submitted) { e.preventDefault(); e.returnValue = ''; } });

load();
</script></body></html>
